<!DOCTYPE html>
<html lang="ko" data-theme="livingtaco">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="../daisyui.generated.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="homepage.css">
    <title>새로고침 — 나의 북마크 도시</title>
</head>
<body class="bg-base-100 text-base-content">
    <div id="viewport">
        <div id="canvas">
            <nav class="account-nav" aria-label="Google 바로가기">
                <a class="link link-hover" href="https://mail.google.com/">Gmail</a>
                <a class="link link-hover" href="https://www.google.com/imghp">이미지</a>
                <a class="apps-button btn btn-ghost btn-circle btn-sm" href="https://about.google/products/" aria-label="Google 앱">⠿</a>
            </nav>

            <main id="city" aria-label="카테고리별 북마크 지도">
                <div id="world">
                    <div id="ground" aria-hidden="true"></div>
                    <div id="zones"></div>
                    <div id="buildings"></div>
                </div>
                <p id="map-status" role="status" aria-live="polite"></p>
            </main>

            <aside class="category-panel card border border-base-300 bg-base-100 shadow-sm" aria-labelledby="category-title">
                <div class="panel-heading">
                    <h1 id="category-title">내 카테고리</h1>
                    <button type="button" class="edit-categories btn btn-outline btn-sm" disabled title="카테고리 편집은 이번 프로토타입 범위에 포함되지 않습니다">수정</button>
                </div>
                <div id="category-list" class="category-list list"></div>
                <div class="total-row"><span>전체 북마크</span><strong id="total-count">00</strong></div>
                <div class="calendar-heading">일정표<span>구글 캘린더 연동 예정</span></div>
            </aside>

            <section id="category-color-picker" class="category-color-picker card" aria-label="카테고리 색상 선택" hidden>
                <button class="picker-saturation" type="button" aria-label="채도와 밝기 선택">
                    <span class="picker-selector"></span>
                </button>
                <label class="picker-hue-label">색조<input class="picker-hue" type="range" min="0" max="359" value="220" aria-label="색조"></label>
                <label class="picker-hex-label">Hex <input class="picker-hex" maxlength="6" value="A6BCE9" aria-label="16진수 색상"></label>
                <span class="picker-preview" aria-hidden="true"></span>
            </section>

        </div>
    </div>

    <section id="bookmark-tooltip" class="bookmark-tooltip card border border-base-300 bg-base-100 shadow-xl" aria-label="북마크 설명" hidden>
        <div class="tooltip-heading"><h2 id="tooltip-name">북마크</h2><span id="tooltip-category"></span></div>
        <div class="page-preview"><img id="tooltip-image" alt=""><div><span class="preview-caption">저장한 페이지</span><strong id="preview-title"></strong><span id="preview-domain"></span></div></div>
        <div class="memo-heading">메모<span></span></div><p id="tooltip-memo">메모가 없습니다.</p>
        <div class="tooltip-bottom"><span id="tooltip-url"></span><button id="copy-link" class="btn btn-link btn-xs" type="button">링크 복사</button></div>
    </section>
    <p id="toast" class="app-toast alert alert-success" role="status" aria-live="polite" hidden></p>
    <script type="module" src="homepage.js"></script>
</body>
</html>
