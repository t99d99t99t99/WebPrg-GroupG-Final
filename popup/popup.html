<!DOCTYPE html>
<html lang="ko" data-theme="livingtaco">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../daisyui.generated.css" />
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="popup.css" />
        <title>페이지 저장</title>
    </head>
    <body class="popup-page">
        <main class="popup-shell">
            <form id="bookmarkForm" class="save-card" novalidate>
                <header class="popup-heading">
                    <span class="popup-logo" aria-hidden="true">💾</span>
                    <h1>현재 페이지를 북마크로 저장합니다.</h1>
                </header>

                <div class="popup-divider" aria-hidden="true"></div>

                <section class="form-section page-name-section">
                    <label for="bookmarkName">페이지 이름</label>
                    <input
                        id="bookmarkName"
                        name="name"
                        type="text"
                        autocomplete="off"
                        placeholder="페이지 이름을 입력하세요."
                        aria-describedby="bookmarkNameError"
                    />
                    <p id="bookmarkNameError" class="field-error" role="status" hidden></p>
                </section>

                <section class="form-section category-section" aria-labelledby="categoryLabel">
                    <span id="categoryLabel" class="field-label">카테고리</span>
                    <div id="categorySelect" class="category-select-host"></div>
                    <p id="categorySelectionError" class="field-error" role="status" hidden></p>
                    <button id="newCategoryButton" class="text-button" type="button">＋ 새 카테고리 만들기</button>

                    <div id="newCategoryFields" class="new-category-fields" hidden>
                        <label for="newCategoryName">새 카테고리 이름</label>
                        <input
                            id="newCategoryName"
                            type="text"
                            autocomplete="off"
                            placeholder="새 카테고리 이름을 입력하세요."
                            aria-describedby="newCategoryNameError"
                        />
                        <p id="newCategoryNameError" class="field-error" role="status" hidden></p>
                        <button id="existingCategoryButton" class="text-button" type="button">
                            기존 카테고리 선택
                        </button>
                    </div>
                </section>

                <section class="form-section memo-section">
                    <label for="bookmarkMemo">메모</label>
                    <textarea
                        id="bookmarkMemo"
                        name="memo"
                        placeholder="페이지를 설명하는 메모를 입력하세요."
                        aria-describedby="bookmarkMemoError"
                    ></textarea>
                    <p id="bookmarkMemoError" class="field-error" role="status" hidden></p>
                </section>

                <div class="form-actions">
                    <button id="cancelButton" class="cancel-button" type="button">취소하기</button>
                    <button id="saveButton" class="save-button" type="submit">저장하기</button>
                </div>
                <p id="status" class="status-message" role="status" aria-live="polite"></p>
            </form>
        </main>
        <script type="module" src="popup.js"></script>
    </body>
</html>
