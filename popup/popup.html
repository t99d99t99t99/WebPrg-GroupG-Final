<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="popup.css">
    <title>페이지 저장</title>
</head>

<body class="popup-page">
    <main class="popup-shell">
        <form id="bookmarkForm" class="save-card">
            <header class="popup-heading">
                <span class="popup-logo" aria-hidden="true">💾</span>
                <div>
                    <h1>페이지 저장</h1>
                    <p>현재 페이지를 북마크 월드에 추가</p>
                </div>
            </header>

            <div class="popup-divider"></div>

            <section class="form-section page-name-section">
                <label for="bookmarkName">페이지 이름</label>
                <input id="bookmarkName" name="name" type="text" placeholder="Google Drive — 웹프로그래밍 자료">
            </section>

            <section class="form-section category-section">
                <label for="categorySelect">카테고리</label>
                <div class="select-wrap">
                    <span class="category-dot" aria-hidden="true"></span>
                    <select id="categorySelect" name="category"></select>
                </div>
                <button id="newCategoryButton" class="text-button" type="button">＋ 새 카테고리 만들기</button>

                <div id="newCategoryFields" class="new-category-fields" hidden>
                    <label for="newCategoryName">새 카테고리 이름</label>
                    <div class="new-category-row">
                        <input id="newCategoryName" type="text" placeholder="새 카테고리 이름">
                        <button id="saveCategoryButton" class="small-primary-button" type="button">카테고리 추가</button>
                    </div>
                </div>
            </section>

            <section class="preview-card" aria-label="저장 위치 미리보기">
                <p class="preview-label">시작 화면에 이렇게 추가돼요</p>
                <div class="preview-content">
                    <div class="preview-tile" aria-hidden="true"><span class="preview-site-icon"></span></div>
                    <p><strong>‘<span id="previewCategory">분류 없음</span>’ 구역에</strong><br>건물로 배치</p>
                </div>
            </section>

            <div class="form-actions">
                <button id="cancelButton" class="cancel-button" type="button">취소</button>
                <button class="save-button" type="submit">저장하기</button>
            </div>
        </form>

        <p id="status" class="status-message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
</body>

</html>
