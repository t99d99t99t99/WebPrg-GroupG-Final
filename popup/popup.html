<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <form id="bookmarkForm">
        <label for="categorySelect">카테고리</label>
        <select id="categorySelect" name="category">
            <option value="">카테고리 없음</option>
        </select>
        <button id="newCategoryButton" type="button">새 카테고리</button>

        <div id="newCategoryFields" hidden>
            <label for="newCategoryName">새 카테고리 이름</label>
            <input id="newCategoryName" type="text">
            <button id="saveCategoryButton" type="button">카테고리 추가</button>
        </div>

        <label for="bookmarkName">이름</label>
        <input id="bookmarkName" name="name" type="text">
        <button type="submit">저장하기</button>
    </form>
    <p id="status" role="status"></p>
    <script type="module" src="popup.js"></script>
</body>

</html>
